<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You... ❤️</title>
    <style>
        * {
            box-sizing: border-box;
        }

        /* Essential for Retro Look: Use a pixellated font similar to MS Sans Serif */
        @font-face {
            font-family: 'Pixelated MS Sans Serif';
            src: url('https://cdn.jsdelivr.net/gh/phuocng/winxp-fonts@master/ms_sans_serif.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            /* Windows XP default background color or use a Bliss wallpaper link */
            background-color: #316AC5; /* XP Teal/Blue */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/e0/Windows_Bliss_Wikipedia.jpg'); /* Bliss Wallpaper */
            background-size: cover;
            background-position: center;
            font-family: 'Pixelated MS Sans Serif', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        /* --- START SCREEN (Classic XP Dialog Box) --- */
        #start-screen {
            position: absolute;
            z-index: 100;
            background-color: #D4D0C8; /* Classic gray */
            border: 2px solid;
            border-color: #FFFFFF #808080 #808080 #FFFFFF; /* Beveled edge */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            padding: 20px;
            text-align: center;
            width: 300px;
            transition: opacity 0.5s ease;
        }

        #start-screen p {
            color: black;
            font-size: 14px;
            margin-bottom: 20px;
            margin-top: 5px;
        }

        .play-btn {
            background-color: #D4D0C8;
            color: black;
            border: 2px solid;
            border-color: #FFFFFF #808080 #808080 #FFFFFF; /* Beveled button edge */
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Pixelated MS Sans Serif', Tahoma;
        }

        .play-btn:active {
            border-color: #808080 #FFFFFF #FFFFFF #808080; /* Sunken button edge on click */
            padding: 11px 29px 9px 31px; /* Slight shift to simulate movement */
        }

        /* --- THE MAIN XP WINDOW CONTAINER --- */
        .xp-window {
            background-color: #D4D0C8; /* Classic gray */
            border: 2px solid;
            border-color: #FFFFFF #808080 #808080 #FFFFFF; /* Classic 3D beveled edge */
            width: 450px;
            max-width: 90%;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.4);
            opacity: 0;
            display: none; /* Hidden until play is clicked */
            transition: opacity 0.8s ease;
        }

        .xp-window.show {
            opacity: 1;
            display: block;
        }

        /* Iconic Blue XP Title Bar */
        .title-bar {
            background: linear-gradient(180deg, #0055EA 0%, #2989FF 45%, #2376E6 60%, #0055EA 100%);
            padding: 3px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 30px;
            color: white;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #002E7A;
        }

        .title-bar-text {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .title-bar-icon {
            width: 16px;
            height: 16px;
            background-image: url('https://win98icons.alexmeub.com/icons/png/key-2.png'); /* Classic key/secret icon */
            background-size: contain;
        }

        /* Min/Max/Close Buttons (Decorative) */
        .title-bar-controls {
            display: flex;
            gap: 2px;
        }

        .title-bar-controls button {
            width: 21px;
            height: 21px;
            border: 1px solid #FFFFFF;
            background-color: transparent;
            color: white;
            font-family: sans-serif;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 3px;
        }
        .title-bar-controls button:hover {
            opacity: 0.8;
        }
        .close-btn { background-color: #EF1111 !important; border: 1px solid #AD0000 !important; }

        /* --- THE CONTENT AREA (DIALOG BODY) --- */
        .window-body {
            padding: 25px;
            text-align: left;
        }

        h1#heading {
            color: #CC0000; /* Red alert text */
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #808080;
            padding-bottom: 5px;
        }

        /* Typewriter Effect Container */
        .typewriter-text {
            color: black;
            font-size: 14px; /* Classic 10pt text size */
            line-height: 1.6;
            min-height: 120px; 
            margin-bottom: 20px;
            display: inline-block;
            border-right: 2px solid black; /* The typing cursor */
            white-space: pre-wrap;
            animation: blink 0.7s step-end infinite;
        }

        /* Blinking Cursor Animation */
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: black; }
        }

        /* Classic Icon next to text */
        .confession-area {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        .message-icon {
            width: 32px;
            height: 32px;
            background-image: url('https://win98icons.alexmeub.com/icons/png/message_envelope_open-0.png'); /* Message icon */
            background-size: contain;
            flex-shrink: 0;
            margin-top: 3px;
        }

        /* --- XP BUTTONS IN DIALOG --- */
        .buttons {
            display: flex;
            justify-content: flex-end; /* XP dialogs usually right-align buttons */
            gap: 10px;
            position: relative;
            height: 35px;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .buttons.show {
            opacity: 1;
        }

        button.xp-btn {
            background-color: #D4D0C8; /* Classic gray */
            color: black;
            border: 2px solid;
            border-color: #FFFFFF #808080 #808080 #FFFFFF; /* Beveled button edge */
            padding: 7px 20px;
            font-size: 14px;
            font-family: 'Pixelated MS Sans Serif', Tahoma;
            cursor: pointer;
        }

        /* Press effect for XP Buttons */
        button.xp-btn:active {
            border-color: #808080 #FFFFFF #FFFFFF #808080; /* Sunken button edge */
            padding: 8px 19px 6px 21px; /* Slight shift to simulate movement */
        }
        
        #yesBtn {
            font-weight: bold; /* 'Yes' is often the default/bold action */
        }

        /* Runaway button logic */
        #noBtn {
            position: absolute;
            right: 0px;
        }

        /* Final Stage styling */
        #final-stage {
            display: none;
            text-align: center;
        }
        #final-stage.show { display: block; }
        #final-stage img { margin: 15px 0; max-width: 100px; }

    </style>
</head>
<body>

    <!-- Background Music Element -->
    <!-- KEEP YOUR MP3 FILE IN GITHUB AS music.mp3 -->
    <audio id="bg-music" src="music.mp3" loop></audio>

    <!-- 1. Start Screen (Classic Dialog) -->
    <div id="start-screen">
        <div class="xp-window" style="opacity:1; display:block; position:relative; width:auto; box-shadow:none;">
            <div class="title-bar">
                <div class="title-bar-text">Attention</div>
            </div>
            <div class="window-body" style="padding: 15px;">
                <p>Incoming transmission received.<br>Action required to proceed.</p>
                <button class="play-btn" onclick="startExperience()">Accept</button>
            </div>
        </div>
    </div>

    <!-- 2. Main XP Window content -->
    <div class="xp-window" id="main-container">
        <!-- The blue XP title bar -->
        <div class="title-bar">
            <div class="title-bar-text">
                <div class="title-bar-icon"></div>
                MsgRecv.exe - Confidential
            </div>
            <div class="title-bar-controls">
                <button onclick="alert('Nice try!')">0</button> <!-- Minimize (_) -->
                <button onclick="alert('Can\'t make this bigger!')">2</button> <!-- Maximize (O) -->
                <button class="close-btn" onclick="alert('Access Denied.')">X</button> <!-- Close (X) -->
            </div>
        </div>

        <!-- The main body where things happen -->
        <div class="window-body">
            
            <div id="typing-stage">
                <h1 id="heading">Message for you...</h1>
                
                <div class="confession-area">
                    <div class="message-icon"></div>
                    <!-- The text that will type itself out -->
                    <div class="typewriter-text" id="confession-text"></div>
                </div>
                
                <div class="buttons" id="btn-container">
                    <button class="xp-btn" id="yesBtn" onclick="celebrate()">Yes</button>
                    <button class="xp-btn" id="noBtn" onmouseover="moveButton()">No</button>
                </div>
            </div>

            <div id="final-stage">
                <h1 id="heading">SYSTEM ACCESS GRANTED</h1>
                <p style="font-size:14px;">Initializing celebration protocol...</p>
                <img src="https://win98icons.alexmeub.com/icons/png/favorites-2.png" alt="Happy icon">
                <p style="font-size:14px; margin-top:10px;">Success!<br>I'll text you soon to make a plan. Check your phone!</p>
            </div>
        </div>
    </div>

    <script>
        // Edit your confession message here! 
        const originalMessage = "I've been holding onto a secret for a while now...\n\nEvery time I talk to you, my day instantly gets better. I've developed a massive crush on you. \n\nWill you go out on a date with me?";
        
        let index = 0;
        const typingSpeed = 50; 
        const textElement = document.getElementById("confession-text");

        function startExperience() {
            // 1. Play the music
            const music = document.getElementById("bg-music");
            music.play().catch(error => {
                console.log("Audio playback failed, but continuing site:", error);
            });

            // 2. Hide the start screen dialog
            const startScreen = document.getElementById("start-screen");
            startScreen.style.opacity = "0";
            setTimeout(() => {
                startScreen.style.display = "none";
            }, 500);

            // 3. Reveal the main XP window container and start typing
            document.getElementById("main-container").classList.add("show");
            setTimeout(typeWriter, 700); 
        }

        function typeWriter() {
            if (index < originalMessage.length) {
                textElement.textContent += originalMessage.charAt(index);
                index++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                // Remove the blinking cursor line when done typing
                textElement.style.borderRight = "none";
                // Show the Yes/No buttons smoothly
                document.getElementById("btn-container").classList.add("show");
            }
        }

        // Runaway 'No' Button logic (Modified for XP layout)
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const windowBody = document.querySelector('.window-body');
            const btnsContainer = document.getElementById('btn-container');

            // Calculate range based on the window body size
            const maxWidth = windowBody.offsetWidth - noBtn.offsetWidth - 20;
            const maxHeight = windowBody.offsetHeight - btnsContainer.offsetHeight - noBtn.offsetHeight - 20;
            
            // Randomly position the button
            const x = Math.random() * maxWidth - (maxWidth/2); // Centers randomness
            const y = (Math.random() * maxHeight * -1) - 40; // Moves it above the original spot
            
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // When 'Yes' is clicked
        function celebrate() {
            // Switch stages smoothly
            document.getElementById('typing-stage').style.display = 'none';
            document.getElementById('final-stage').classList.add('show');
            
            // Optional: change music volume, speed, etc.
        }
    </script>
</body>
</html>
