<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Me... ❤️</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        /* 1. START SCREEN (Play Button) */
        #start-screen {
            position: absolute;
            z-index: 10;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }
        .play-btn {
            background-color: #ff477e;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 71, 126, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .play-btn:hover {
            transform: scale(1.1);
            background-color: #ff5c8a;
        }

        /* 2. MAIN CONFESSION SCREEN */
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }
        .container.show {
            opacity: 1;
            transform: translateY(0);
        }
        h1 {
            color: #ff477e;
            margin-bottom: 25px;
        }

        /* Typewriter Effect Container */
        .typewriter-text {
            color: #495057;
            font-size: 1.2rem;
            line-height: 1.6;
            min-height: 100px; /* Keeps space while typing */
            margin-bottom: 30px;
            display: inline-block;
            border-right: 3px solid #ff477e; /* The typing cursor */
            white-space: pre-wrap;
            animation: blink 0.75s step-end infinite;
        }

        /* Blinking Cursor Animation */
        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #ff477e; }
        }

        /* Buttons (hidden initially until typing finishes) */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .buttons.show {
            opacity: 1;
        }
        button.action-btn {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        #yesBtn {
            background-color: #ff477e;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4);
        }
        #yesBtn:hover {
            transform: scale(1.1);
        }
        #noBtn {
            background-color: #6c757d;
            color: white;
            position: absolute;
            right: 50px;
        }
    </style>
</head>
<body>

    <!-- Background Music Element -->
    <!-- REPLACE "music.mp3" WITH YOUR ACTUAL AUDIO LINK OR FILE -->
    <audio id="bg-music" src="music.mp3" loop></audio>

    <!-- 1. Start Screen with Play Button -->
    <div id="start-screen">
        <button class="play-btn" onclick="startExperience()">Play Me 🎧</button>
    </div>

    <!-- 2. Main Site content -->
    <div class="container" id="main-container">
        <h1 id="heading">For You... ✨</h1>
        
        <!-- The text that will type itself out -->
        <div class="typewriter-text" id="confession-text"></div>
        
        <div class="buttons" id="btn-container">
            <button class="action-btn" id="yesBtn" onclick="celebrate()">Yes! 🥰</button>
            <button class="action-btn" id="noBtn" onmouseover="moveButton()">No 😢</button>
        </div>
    </div>

    <script>
        // Edit your confession message here! 
        // Use \n if you want to start a new line.
        const originalMessage = "I've been holding onto a secret for a while now...\n\nEvery time I talk to you, my day instantly gets better. I've developed a massive crush on you. \n\nWill you go out on a date with me? 🌹";
        
        let index = 0;
        const typingSpeed = 50; // Speed in milliseconds per character (lower = faster)
        const textElement = document.getElementById("confession-text");

        function startExperience() {
            // 1. Play the music
            const music = document.getElementById("bg-music");
            music.play().catch(error => {
                console.log("Audio playback failed, but continuing site:", error);
            });

            // 2. Hide the start screen overlay smoothly
            const startScreen = document.getElementById("start-screen");
            startScreen.style.opacity = "0";
            setTimeout(() => {
                startScreen.style.display = "none";
            }, 800);

            // 3. Reveal the content container and start typing
            document.getElementById("main-container").classList.add("show");
            setTimeout(typeWriter, 1000); // Small pause before typing starts
        }

        function typeWriter() {
            if (index < originalMessage.length) {
                textElement.textContent += originalMessage.charAt(index);
                index++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                // Remove the blinking cursor line when done typing
                textElement.style.borderRight = "none";
                // Show the Yes/No buttons smoothly
                document.getElementById("btn-container").classList.add("show");
            }
        }

        // Runaway 'No' Button logic
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 60);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 60);
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // When 'Yes' is clicked
        function celebrate() {
            document.getElementById('heading').innerText = "YAYYYYY! 🎉❤️";
            textElement.textContent = "You just made my entire week! Let's text and figure out a day. Check your phone soon! 😉";
            document.getElementById('btn-container').style.display = 'none';
        }
    </script>
</body>
</html>
